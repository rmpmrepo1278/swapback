# Extra secret rules in gitleaks format, loaded after the pinned gitleaks default rules (vendor/gitleaks).
# Only for key formats gitleaks v8.30.1 has no rule for.
[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key (no gitleaks rule as of v8.30.1)"
regex = '''sk-or-v1-[A-Za-z0-9_\-]{16,}'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "tailscale-key"
description = "Tailscale auth/API key (no gitleaks rule as of v8.30.1)"
regex = '''tskey-[A-Za-z0-9\-]{20,}'''
keywords = ["tskey-"]

[[rules]]
id = "bearer-token"
description = "HTTP Authorization bearer value (gitleaks' generic rule needs an assignment operator)"
regex = '''(?i)\bbearer\s+([A-Za-z0-9._\-]{24,})'''
secretGroup = 1
keywords = ["bearer"]

[[rules]]
id = "stripe-key-any-delimiter"
description = "Stripe secret/restricted key followed by any non-key character (gitleaks' rule wants a quote, a space or ; after it, so a key inside HTML or before a comma or period was missed; a key body holds a digit, so sk_test_environment.py is not a key)"
regex = '''(?:^|[^A-Za-z0-9_])((?:sk|rk)_(?:test|live|prod)_(?=[A-Za-z0-9]*[0-9])[A-Za-z0-9]{10,99})(?:[^A-Za-z0-9_]|$)'''
secretGroup = 1
entropy = 2
keywords = ["sk_test", "sk_live", "sk_prod", "rk_test", "rk_live", "rk_prod"]

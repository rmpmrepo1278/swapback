name: release

# Builds the sdist and wheel on a version tag (v*) and checks them. Publishing to PyPI uses Trusted Publishing (no
# token) and runs only when the repository variable PYPI_PUBLISH is "true", after the PyPI project's trusted
# publisher has been set up. To publish a tag that was pushed before that: Actions > release > Run workflow > pick the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel and run the tests against it
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl pytest==8.4.2
          cd tests && /tmp/w/bin/python -m pytest -q -p no:cacheprovider ..
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/swapback
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swapback"
version = "0.4.11"
description = "Local proxy that swaps personal data for placeholders before an LLM call and restores it byte-exact in the reply. Fails closed. OpenAI-compatible."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "rmpmrepo1278"}]
requires-python = ">=3.11"
keywords = ["pii", "privacy", "llm", "proxy", "redaction", "anonymization", "pseudonymization", "openai", "anthropic",
            "ai-agents", "data-protection"]
dependencies = [
    "phonenumbers==9.0.43",
    "pyahocorasick==2.3.1",
    "PyYAML==6.0.3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/rmpmrepo1278/swapback"
Documentation = "https://github.com/rmpmrepo1278/swapback#readme"
Issues = "https://github.com/rmpmrepo1278/swapback/issues"
Changelog = "https://github.com/rmpmrepo1278/swapback/blob/main/CHANGELOG.md"
Security = "https://github.com/rmpmrepo1278/swapback/security/policy"

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
swapback = "swapback.core:main"
swapback-proxy = "swapback.proxy:main"

[tool.setuptools]
packages = ["swapback", "swapback.vendor", "swapback.vendor.gitleaks", "swapback.vendor.presidio"]

[tool.setuptools.package-data]
"swapback" = ["examples/*.yaml", "data/*.gz"]
"swapback.vendor" = ["*.toml", "*.md"]
"swapback.vendor.gitleaks" = ["*"]
"swapback.vendor.presidio" = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

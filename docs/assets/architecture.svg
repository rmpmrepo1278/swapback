<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-label="Architecture: your app or agent sends requests through pii-scrubber, which swaps personal values for placeholders before the LLM API and restores them in the reply">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#141B34"/></linearGradient></defs>
<rect width="1400" height="600" rx="24" fill="url(#bg)"/>
<text x="48" y="64" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC">How a request flows</text>
<text x="48" y="94" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Real values never leave your machine. The provider only ever sees placeholders.</text>
<rect x="40" y="170" width="230" height="200" rx="16" fill="#111A2E" stroke="#26314F" stroke-width="2"/>
<text x="155.0" y="214" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">Your app / agent</text>
<text x="155.0" y="240" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">any OpenAI-style client</text>
<text x="155" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">SDK, CLI agent, curl:</text>
<text x="155" y="312" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">just change base_url</text>
<rect x="506" y="140" width="388" height="260" rx="18" fill="#111A2E" stroke="url(#g)" stroke-width="3"/>
<g transform="translate(526,156) scale(0.203125)">
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="78,98 52,128 78,158"/><polyline points="104,98 78,128 104,158"/>
    <polyline points="152,98 178,128 152,158"/><polyline points="178,98 204,128 178,158"/>
  </g>
  <rect x="112" y="118" width="32" height="20" rx="6" fill="#0B1020" fill-opacity="0.85"/>
</g>
<text x="590" y="192" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">pii-scrubber</text>
<text x="590" y="214" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#94A3B8">127.0.0.1:8787</text>
<g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#E5E7EB">
<text x="530" y="256"><tspan fill="#2DD4BF" font-weight="700">1</tspan>  swap known values + pattern matches</text>
<text x="530" y="286"><tspan fill="#2DD4BF" font-weight="700">2</tspan>  re-check: any known value left? block</text>
<text x="530" y="316"><tspan fill="#2DD4BF" font-weight="700">3</tspan>  forward, or answer 503 (fail closed)</text>
<text x="530" y="346"><tspan fill="#2DD4BF" font-weight="700">4</tspan>  restore reply: JSON, SSE, tool args</text>
<text x="530" y="376" fill="#94A3B8" font-size="14">logs counts and types, never values</text>
</g>
<rect x="1130" y="170" width="230" height="200" rx="16" fill="#111A2E" stroke="#26314F" stroke-width="2"/>
<text x="1245.0" y="214" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC">LLM API</text>
<text x="1245.0" y="240" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94A3B8">OpenAI-compatible upstream</text>
<text x="1245" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">OpenAI, OpenRouter,</text>
<text x="1245" y="312" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">LiteLLM, vLLM, llama.cpp</text>
<!-- request path -->
<line x1="278" y1="230" x2="486" y2="230" stroke="#FBBF24" stroke-width="3"/><polygon points="498,230 484,222 484,238" fill="#FBBF24"/>
<text x="388" y="214" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#FBBF24">Jane Q Doe, (425) 555-0182</text>
<text x="388" y="254" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">request</text>
<line x1="902" y1="230" x2="1110" y2="230" stroke="#2DD4BF" stroke-width="3"/><polygon points="1122,230 1108,222 1108,238" fill="#2DD4BF"/>
<text x="1012" y="214" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#2DD4BF">«PERSON_1», «PHONE_1»</text>
<text x="1012" y="254" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">scrubbed request</text>
<!-- reply path -->
<line x1="1122" y1="320" x2="914" y2="320" stroke="#2DD4BF" stroke-width="3"/><polygon points="902,320 916,312 916,328" fill="#2DD4BF"/>
<text x="1012" y="304" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#2DD4BF">"Hi «PERSON_1», …"</text>
<text x="1012" y="344" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">reply with placeholders</text>
<line x1="498" y1="320" x2="290" y2="320" stroke="#FBBF24" stroke-width="3"/><polygon points="278,320 292,312 292,328" fill="#FBBF24"/>
<text x="388" y="304" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#FBBF24">"Hi Jane Q Doe, …"</text>
<text x="388" y="344" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">restored byte-exact</text>
<!-- local state -->
<g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14">
<line x1="700" y1="400" x2="700" y2="440" stroke="#26314F" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="356" y="440" width="216" height="64" rx="12" fill="#0F172A" stroke="#26314F"/>
<text x="464" y="468" text-anchor="middle" fill="#E5E7EB">known.yaml</text><text x="464" y="490" text-anchor="middle" fill="#94A3B8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">your names, emails, phones</text>
<rect x="592" y="440" width="216" height="64" rx="12" fill="#0F172A" stroke="#26314F"/>
<text x="700" y="468" text-anchor="middle" fill="#E5E7EB">patterns</text><text x="700" y="490" text-anchor="middle" fill="#94A3B8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">emails, phones, cards, keys</text>
<rect x="828" y="440" width="216" height="64" rx="12" fill="#0F172A" stroke="#26314F"/>
<text x="936" y="468" text-anchor="middle" fill="#E5E7EB">vault.json</text><text x="936" y="490" text-anchor="middle" fill="#94A3B8" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">value ↔ placeholder, 0600</text>
<line x1="464" y1="440" x2="936" y2="440" stroke="#26314F" stroke-width="2" stroke-dasharray="5 5"/>
</g>
<g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
<circle cx="56" cy="556" r="7" fill="#FBBF24"/><text x="72" y="561" fill="#E5E7EB">real value (stays on your machine)</text>
<circle cx="372" cy="556" r="7" fill="#2DD4BF"/><text x="388" y="561" fill="#E5E7EB">placeholder (what the provider sees)</text>
<text x="1352" y="561" text-anchor="end" fill="#94A3B8">no NER model · 3 dependencies · runs on loopback</text>
</g>
</svg>
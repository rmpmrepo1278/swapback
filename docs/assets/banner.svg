<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="pii-scrubber: keep personal data out of LLM requests">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#141B34"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.2" r="0.6"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.05"/></pattern>
</defs>
<rect width="1280" height="400" rx="24" fill="url(#bg)"/><rect width="1280" height="400" rx="24" fill="url(#dots)"/><rect width="1280" height="400" rx="24" fill="url(#glow)"/>
<g transform="translate(84,96) scale(0.78125)">
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#g)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="78,98 52,128 78,158"/><polyline points="104,98 78,128 104,158"/>
    <polyline points="152,98 178,128 152,158"/><polyline points="178,98 204,128 178,158"/>
  </g>
  <rect x="112" y="118" width="32" height="20" rx="6" fill="#0B1020" fill-opacity="0.85"/>
</g>
<text x="330" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">pii-scrubber</text>
<text x="333" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#94A3B8">Keep personal data out of LLM requests.</text>
<text x="333" y="258" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#94A3B8">Restore it byte-exact in the reply. Fail closed.</text>
<g font-family="'JetBrains Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="21">
  <rect x="330" y="290" width="604" height="50" rx="12" fill="#0F172A" stroke="#26314F"/>
  <text x="352" y="322" fill="#FBBF24">Jane Q Doe</text>
  <text x="494" y="322" fill="#94A3B8">→</text>
  <text x="530" y="322" fill="#2DD4BF">«PERSON_1»</text>
  <text x="676" y="322" fill="#94A3B8">→</text>
  <text x="712" y="322" fill="#FBBF24">Jane Q Doe</text>
  <text x="858" y="322" fill="#94A3B8" font-size="15">✓ exact</text>
</g>
</svg>